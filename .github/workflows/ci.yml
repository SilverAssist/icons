name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    # publish.yml builds and releases on Node 24; testing only on 20 shipped an
    # artifact built on a version CI never exercised.
    name: Code Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check formatting
        run: npm run format:check
      
      - name: Run linter
        run: npm run lint
      
      - name: Type check
        run: npm run typecheck
      
      - name: Build package
        run: npm run build
      
      - name: Create summary
        if: success()
        run: |
          echo "## ✅ All Quality Checks Passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code formatting (Prettier)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linting (ESLint)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Type checking (TypeScript)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build successful" >> $GITHUB_STEP_SUMMARY

  integration:
    # Consumes the *packed tarball* from a real Next.js app, which is the only
    # way three defects found in this org were visible: these icons are pure SVG
    # with no hooks, so they must render entirely on the server and ship no JS;
    # one stray hook or directive would silently turn 168 static components into
    # client components. It also catches an
    # `exports` map pointing at files the build never produced, and and a documented
    # ./styles export pointing at a file the build never emitted (the missing
    # ./styles stylesheet). No unit test can see any of
    # them.
    name: Next.js integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build fixture against the packed tarball
        run: npm run e2e:setup

      - name: Run integration specs
        run: npx playwright test -c e2e/playwright.config.ts

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: e2e/test-results/
          retention-days: 7

