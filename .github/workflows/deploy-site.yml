name: Deploy docs site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'src/icons/**'
      - 'package.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # Icon components live in ../src/icons, outside site/ -- Vite's builtin
      # TS transform resolves each transformed file's tsconfig by walking up
      # from *that file's own directory*, which for those files lands on the
      # repo root's tsconfig.json, not site/tsconfig.json. Since that root
      # config extends @silverassist/npm-package-standards/tsconfig/react,
      # the root node_modules has to exist too, or resolution fails with
      # "Tsconfig not found @silverassist/npm-package-standards/tsconfig/react"
      # (see the react/react-dom alias in vite.config.ts for the same class
      # of cross-boundary resolution issue).
      - name: Install root dependencies
        run: npm ci

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        working-directory: site/dist
        run: |
          cp index.html 404.html
          touch .nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
